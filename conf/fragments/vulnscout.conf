BB_CONF_FRAGMENT_SUMMARY = "This fragment enables vulnscout"
BB_CONF_FRAGMENT_DESCRIPTION = "Enables vulnscout and applies the following configurations: \
 - Adds the vulnscout class to IMAGE_CLASSES. \
 - Adds docker to HOSTTOOLS_NONFATAL. \
"

IMAGE_CLASSES:append = " vulnscout"

HOSTTOOLS_NONFATAL += "docker"
